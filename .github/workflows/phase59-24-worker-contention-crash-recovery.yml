name: Phase 59.24 Worker Contention Duplicate Delivery and Crash Recovery

on:
  push:
    branches:
      - phase59-24-worker-contention-crash-recovery
    paths:
      - 'scripts/federation_git_ref_store.py'
      - 'scripts/github_api_quota_guard.py'
      - 'tests/test_federation_worker_contention.py'
      - 'tests/test_federation_git_ref_store.py'
      - 'tests/test_federation_quota_arbiter.py'
      - 'tests/test_federation_partitioned_journal.py'
      - '.github/workflows/phase59-24-worker-contention-crash-recovery.yml'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase59-24-worker-contention-crash-recovery-ci
  cancel-in-progress: false

jobs:
  contention-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile control-plane modules
        run: python3 -m py_compile scripts/federation_git_ref_store.py scripts/federation_quota_arbiter.py scripts/github_api_quota_guard.py
      - name: Run 8-worker contention, duplicate-delivery and crash-recovery tests
        run: python3 -m unittest discover -s tests -p 'test_federation_worker_contention.py' -v
      - name: Run prior federation regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_federation_git_ref_store.py' -v
          python3 -m unittest discover -s tests -p 'test_federation_quota_arbiter.py' -v
          python3 -m unittest discover -s tests -p 'test_federation_partitioned_journal.py' -v
