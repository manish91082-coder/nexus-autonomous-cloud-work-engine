name: Recruitment Revenue Assurance Browser QA

on:
  push:
    branches: [master]
    paths:
      - "products/recruitment-agency-revenue-assurance/**"
      - "tests/recruitment_browser_qa.mjs"
      - ".github/workflows/recruitment-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recruitment-browser-qa
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical product
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Start local-only product server
        run: |
          python3 -m http.server 8765 --directory products/recruitment-agency-revenue-assurance >/tmp/recruitment-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/recruitment-http.log
          exit 1
      - name: Run browser interaction and accessibility smoke checks
        env:
          BASE_URL: http://127.0.0.1:8765/
        run: node tests/recruitment_browser_qa.mjs
