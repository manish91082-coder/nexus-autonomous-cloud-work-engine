name: Phase 59.58 Durable Mission Dispatcher Shadow Runtime

on:
  push:
    branches: [phase59-58-durable-dispatcher-shadow-integration, phase59-62-dependency-hardening]
    paths:
      - 'cloud/swarm/mission-dispatcher-shadow-worker.mjs'
      - 'cloud/swarm/mission-dispatcher-shadow.mjs'
      - 'cloud/swarm/specialist-graph.mjs'
      - 'cloud/swarm/swarm-run-rpc-client.mjs'
      - 'cloud/swarm/swarm-run-do.mjs'
      - 'cloud/swarm/worker-tests/**'
      - 'schemas/mission-dispatcher-shadow-envelope-v1.schema.json'
      - '.github/workflows/phase59-58-durable-dispatcher-shadow.yml'
  pull_request:
    branches: [master, phase59-62-dependency-hardening]
    paths:
      - 'cloud/swarm/mission-dispatcher-shadow-worker.mjs'
      - 'cloud/swarm/mission-dispatcher-shadow.mjs'
      - 'cloud/swarm/specialist-graph.mjs'
      - 'cloud/swarm/swarm-run-rpc-client.mjs'
      - 'cloud/swarm/swarm-run-do.mjs'
      - 'cloud/swarm/worker-tests/**'
      - 'schemas/mission-dispatcher-shadow-envelope-v1.schema.json'
      - '.github/workflows/phase59-58-durable-dispatcher-shadow.yml'

permissions:
  contents: read

concurrency:
  group: phase59-58-durable-dispatcher-shadow
  cancel-in-progress: false

jobs:
  workers-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud/swarm/worker-tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
      - name: Pin npm CLI without lifecycle scripts
        run: |
          npm install --global npm@11.6.3 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = "v22.16.0"
          test "$(npm --version)" = "11.6.3"
      - name: Verify lockfile and install exact dependencies
        run: |
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "0e711759dcccb19798a1fe76473a4a665741a91a84747bf4ecda18aaed73d48f"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Run complete Workers/workerd suite
        run: npm test
