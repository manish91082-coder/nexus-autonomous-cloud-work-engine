name: Phase 59.25 Cloud Soak Contract and Regression CI

on:
  push:
    branches:
      - phase59-25-cloud-operational-soak
    paths:
      - 'scripts/github_api_quota_guard.py'
      - 'scripts/federation_git_ref_store.py'
      - 'scripts/phase59_25_cloud_soak.py'
      - 'tests/test_github_api_quota_guard.py'
      - 'tests/test_federation_git_ref_store.py'
      - 'tests/test_federation_quota_arbiter.py'
      - 'tests/test_federation_partitioned_journal.py'
      - '.github/workflows/phase59-25-cloud-soak-ci.yml'
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: phase59-25-cloud-soak-ci
  cancel-in-progress: false

jobs:
  cloud-soak-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Compile cloud soak and control-plane modules
        run: python3 -m py_compile scripts/phase59_25_cloud_soak.py scripts/github_api_quota_guard.py scripts/federation_git_ref_store.py
      - name: Run thread-safe quota guard tests
        run: python3 -m unittest discover -s tests -p 'test_github_api_quota_guard.py' -v
      - name: Run federation lock, quota and journal regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_federation_git_ref_store.py' -v
          python3 -m unittest discover -s tests -p 'test_federation_quota_arbiter.py' -v
          python3 -m unittest discover -s tests -p 'test_federation_partitioned_journal.py' -v
