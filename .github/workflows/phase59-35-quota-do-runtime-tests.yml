name: Phase 59.35 Cloudflare Workers SQLite Durable Object Runtime Tests

on:
  push:
    branches: [master, phase59-35-quota-do-runtime-tests, phase59-36-cross-worker-caller, phase59-37-internal-caller-auth, phase59-39-transactional-telemetry-ingestion, phase59-40-telemetry-driven-admission, phase59-41-quota-client-lifecycle, phase59-42-secondary-rate-limit-controller, phase59-43-lease-renewal-uncertain-reconciliation, phase59-44-read-only-shadow-worker, phase59-53-project-cell-durable-swarm-ledger, phase59-58-durable-dispatcher-shadow-integration, phase59-61-budget-dispatcher-integration, phase59-62-dependency-hardening, phase59-63-independent-workflow-run-proof, phase59-64-default-branch-execution-guard, phase59-64-host-slot-run-identity-binding, phase59-65-current-task-dispatch-guard, phase59-66-publisher-api-boundary, phase59-67-sanitized-summary-schema, phase59-68-publisher-branch-integrity, phase59-69-artifact-provenance, phase59-70-offline-publisher-dry-run]
    paths:
      - 'cloud/swarm/quota-ledger-do.mjs'
      - 'cloud/swarm/swarm-run-do.mjs'
      - 'cloud/swarm/swarm-run-host.mjs'
      - 'cloud/swarm/mission-dispatcher-shadow-worker.mjs'
      - 'cloud/swarm/mission-dispatcher-shadow.mjs'
      - 'cloud/swarm/specialist-graph.mjs'
      - 'cloud/swarm/swarm-run-rpc-client.mjs'
      - 'schemas/mission-dispatcher-shadow-envelope-v1.schema.json'
      - 'schemas/swarm-run-ledger-v1.schema.json'
      - 'cloud/swarm/quota-ledger-contract.mjs'
      - 'cloud/swarm/github-quota-telemetry.mjs'
      - 'cloud/swarm/github-operation-registry.mjs'
      - 'cloud/swarm/quota-ledger-client.mjs'
      - 'cloud/swarm/read-only-swarm-worker.mjs'
      - 'cloud/swarm/github-secondary-rate-limit.mjs'
      - 'cloud/swarm/worker-tests/**'
      - 'cloud/swarm/independent-host-tests/**'
      - 'scripts/current_task_guard.py'
      - 'scripts/constrained_publisher.py'
      - 'scripts/p10cr_summary_schema.py'
      - 'scripts/p10cr_artifact_provenance.py'
      - 'scripts/ai_task_executor.py'
      - 'scripts/worker_tick.py'
      - 'tests/test_ai_task_executor.py'
      - 'tests/test_constrained_publisher.py'
      - 'tests/test_p10cr_summary_schema.py'
      - 'tests/test_p10cr_artifact_provenance.py'
      - 'schemas/p10cr-worker-draft-summary-v1.schema.json'
      - 'schemas/p10cr-worker-draft-summary-v2.schema.json'
      - '.github/workflows/p10cr-constrained-publisher.yml'
      - '.github/workflows/phase59-63-independent-workflow-run-proof.yml'
      - '.github/workflows/phase59-35-quota-do-runtime-tests.yml'
  pull_request:
    branches: [master, phase59-57-constrained-publisher-separation, phase59-61-budget-dispatcher-integration, phase59-62-dependency-hardening, phase59-63-independent-workflow-run-proof, phase59-64-default-branch-execution-guard, phase59-64-host-slot-run-identity-binding, phase59-65-current-task-dispatch-guard, phase59-66-publisher-api-boundary, phase59-67-sanitized-summary-schema, phase59-68-publisher-branch-integrity, phase59-69-artifact-provenance, phase59-70-offline-publisher-dry-run]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase59-35-quota-do-runtime-tests
  cancel-in-progress: false

jobs:
  workers-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud/swarm/worker-tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0

      - name: Pin npm CLI without running lifecycle scripts
        run: |
          npm install --global npm@11.6.3 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = "v22.16.0"
          test "$(npm --version)" = "11.6.3"

      - name: Verify committed lockfile and dependency integrity
        run: |
          test -f package-lock.json
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "0e711759dcccb19798a1fe76473a4a665741a91a84747bf4ecda18aaed73d48f"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          if (lock.lockfileVersion !== 3) throw new Error("LOCKFILE_VERSION_NOT_3");
          const expected = {
            "@cloudflare/vitest-plugin": "1.8.3",
            "vitest": "4.1.12",
            "workerd": "1.20261116.1",
            "miniflare": "5.20261116.0-beta"
          };
          for (const [name, version] of Object.entries(expected)) {
            if (lock.packages["node_modules/" + name]?.version !== version) throw new Error("LOCKFILE_PIN_MISMATCH:" + name);
          }
          const entries = Object.entries(lock.packages).filter(([name]) => name.startsWith("node_modules/"));
          if (entries.some(([, value]) => value.resolved && !value.integrity)) throw new Error("LOCKFILE_INTEGRITY_MISSING");
          if (entries.some(([, value]) => value.resolved && !value.resolved.startsWith("https://registry.npmjs.org/"))) throw new Error("LOCKFILE_NON_REGISTRY_SOURCE");
          console.log("LOCKFILE_VALID packages=" + entries.length);
          NODE

      - name: Install exact dependencies with lifecycle scripts disabled
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run independent-host client offline tests
        run: node --test ../independent-host-tests/host-client.test.mjs ../independent-host-tests/cross-run-client.test.mjs ../independent-host-tests/owner-preflight.test.mjs

      - name: Validate owner-gated independent-host workflow YAML syntax
        run: ruby -e 'require "yaml"; [".github/workflows/phase59-62-independent-host-test.yml", ".github/workflows/phase59-63-independent-workflow-run-proof.yml", ".github/workflows/p10cr-constrained-publisher.yml", ".github/workflows/mission-autonomous-worker.yml", ".github/workflows/phase59-35-quota-do-runtime-tests.yml"].each { |path| YAML.parse_file("../../../" + path) }; puts "YAML_SYNTAX_PASS"'

      - name: Set up Python 3.12 for mission task-scope safety tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node 24)
        with:
          python-version: '3.12'

      - name: Run P59-003 shared current-task guard and AI executor safety tests
        working-directory: .
        run: python3 -m unittest discover -s tests -p 'test_ai_task_executor.py' -v

      - name: Run constrained publisher validation, owner gate, event replay and no-token dry-run tests
        working-directory: .
        run: python3 -m unittest discover -s tests -p 'test_constrained_publisher.py' -v

      - name: Run strict P10CR worker summary schema and provenance tests
        working-directory: .
        run: python3 -m unittest discover -s tests -p 'test_p10cr_summary_schema.py' -v

      - name: Run immutable source workflow and artifact digest provenance tests
        working-directory: .
        run: python3 -m unittest discover -s tests -p 'test_p10cr_artifact_provenance.py' -v

      - name: Run Cloudflare Workers runtime tests
        run: npm test
      - name: Run isolated Phase59.63 cross-run runtime test
        run: npx vitest run --config phase59-63.vitest.config.mjs
