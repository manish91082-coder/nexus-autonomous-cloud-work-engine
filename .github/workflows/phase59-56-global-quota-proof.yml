name: Phase 59.56 Synthetic Cross-Repository Global Quota Proof

on:
  push:
    branches: [phase59-56-synthetic-global-quota-proof]
    paths:
      - 'cloud/swarm/**'
      - 'schemas/phase59-56-cross-repository-quota-envelope-v1.schema.json'
      - '.github/workflows/phase59-56-global-quota-proof.yml'
  pull_request:
    branches: [phase59-54-deterministic-shadow-ledger-path-master-sync]
    paths:
      - 'cloud/swarm/**'
      - 'schemas/phase59-56-cross-repository-quota-envelope-v1.schema.json'
      - '.github/workflows/phase59-56-global-quota-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase59-56-global-quota-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-global-quota:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud/swarm/worker-tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install isolated test dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete Workers/workerd suite
        run: npm test
