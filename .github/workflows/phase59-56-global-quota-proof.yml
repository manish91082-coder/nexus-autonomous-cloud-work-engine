name: Phase 59.56 Synthetic Cross-Repository Global Quota Proof

on:
  push:
    branches: [phase59-56-synthetic-global-quota-proof, phase59-62-dependency-hardening]
    paths:
      - 'cloud/swarm/**'
      - 'schemas/phase59-56-cross-repository-quota-envelope-v1.schema.json'
      - '.github/workflows/phase59-56-global-quota-proof.yml'
  pull_request:
    branches: [phase59-54-deterministic-shadow-ledger-path-master-sync, phase59-62-dependency-hardening]
    paths:
      - 'cloud/swarm/**'
      - 'schemas/phase59-56-cross-repository-quota-envelope-v1.schema.json'
      - '.github/workflows/phase59-56-global-quota-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase59-56-global-quota-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-global-quota:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud/swarm/worker-tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
      - name: Pin npm CLI without lifecycle scripts
        run: |
          npm install --global npm@11.6.3 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = "v22.16.0"
          test "$(npm --version)" = "11.6.3"
      - name: Verify lockfile and install exact dependencies
        run: |
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "0e711759dcccb19798a1fe76473a4a665741a91a84747bf4ecda18aaed73d48f"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Run complete Workers/workerd suite
        run: npm test
