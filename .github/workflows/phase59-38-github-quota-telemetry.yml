name: Phase 59.38 GitHub Quota Telemetry Contracts

on:
  push:
    branches: [master, phase59-38-github-quota-telemetry, phase59-39-transactional-telemetry-ingestion]
    paths:
      - 'cloud/swarm/github-quota-telemetry.mjs'
      - 'cloud/swarm/github-quota-telemetry.test.mjs'
      - '.github/workflows/phase59-38-github-quota-telemetry.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase59-38-github-quota-telemetry
  cancel-in-progress: false

jobs:
  telemetry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Syntax check
        run: node --check cloud/swarm/github-quota-telemetry.mjs
      - name: Run deterministic telemetry tests
        run: node --test cloud/swarm/github-quota-telemetry.test.mjs
