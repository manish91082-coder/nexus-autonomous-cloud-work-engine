name: Phase 59.60 Account-Scope Platform Budget Runtime Tests

on:
  push:
    branches: [phase59-60-account-scope-platform-budget, phase59-62-dependency-hardening]
    paths:
      - 'cloud/swarm/platform-budget-do.mjs'
      - 'cloud/swarm/platform-budget-host.mjs'
      - 'cloud/swarm/platform-budget-rpc-client.mjs'
      - 'cloud/swarm/worker-tests/platform-budget-*'
      - 'cloud/swarm/worker-tests/package.json'
      - 'cloud/swarm/worker-tests/package-lock.json'
      - '.github/workflows/phase59-60-account-scope-platform-budget.yml'
  pull_request:
    branches: [phase59-58-durable-dispatcher-shadow-integration, phase59-61-budget-dispatcher-integration, phase59-62-dependency-hardening]
    paths:
      - 'cloud/swarm/platform-budget-do.mjs'
      - 'cloud/swarm/platform-budget-host.mjs'
      - 'cloud/swarm/platform-budget-rpc-client.mjs'
      - 'cloud/swarm/worker-tests/platform-budget-*'
      - '.github/workflows/phase59-60-account-scope-platform-budget.yml'

permissions:
  contents: read

concurrency:
  group: phase59-60-account-scope-platform-budget
  cancel-in-progress: false

jobs:
  account-budget-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud/swarm/worker-tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
      - name: Pin npm CLI without lifecycle scripts
        run: |
          npm install --global npm@11.6.3 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = "v22.16.0"
          test "$(npm --version)" = "11.6.3"
      - name: Require committed lockfile and install exact dependencies
        run: |
          test -f package-lock.json
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "9c2f655c6230decf204b65fd6278e1ac45d0851f3ed0544bcbc16ab94694d914"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Run account-scope platform budget tests
        run: npx vitest run --config platform-budget.vitest.config.mjs
