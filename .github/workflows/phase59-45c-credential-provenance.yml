name: Phase 59.45C Credential Provenance Verifier

on:
  push:
    branches: [phase59-45b-canonical-installation-scope]
    paths:
      - 'cloud/swarm/credential-provenance.mjs'
      - 'cloud/swarm/credential-provenance.test.mjs'
      - 'cloud/swarm/request-fingerprint.mjs'
      - 'cloud/swarm/request-fingerprint.test.mjs'
      - 'cloud/swarm/egress-receipt.mjs'
      - 'cloud/swarm/egress-receipt.test.mjs'
      - 'cloud/swarm/service-assertion.mjs'
      - 'cloud/swarm/service-assertion.test.mjs'
      - 'cloud/swarm/broker-egress-harness.test.mjs'
      - 'cloud/swarm/github-response-evidence.mjs'
      - 'cloud/swarm/github-response-evidence.test.mjs'
      - '.github/workflows/phase59-45c-credential-provenance.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase59-45c-credential-provenance
  cancel-in-progress: false

jobs:
  provenance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Syntax check
        run: node --check cloud/swarm/credential-provenance.mjs
      - name: Run synthetic ES256 provenance tests
        run: node --test cloud/swarm/credential-provenance.test.mjs
      - name: Syntax check request fingerprint
        run: node --check cloud/swarm/request-fingerprint.mjs
      - name: Run request fingerprint contract tests
        run: node --test cloud/swarm/request-fingerprint.test.mjs
      - name: Syntax check egress receipt verifier
        run: node --check cloud/swarm/egress-receipt.mjs
      - name: Run synthetic egress receipt tests
        run: node --test cloud/swarm/egress-receipt.test.mjs
      - name: Syntax check GitHub response evidence
        run: node --check cloud/swarm/github-response-evidence.mjs
      - name: Run GitHub response evidence tests
        run: node --test cloud/swarm/github-response-evidence.test.mjs
      - name: Run synthetic broker-to-egress trust harness
        run: node --test cloud/swarm/broker-egress-harness.test.mjs
      - name: Syntax check service assertion verifier
        run: node --check cloud/swarm/service-assertion.mjs
      - name: Run synthetic service assertion tests
        run: node --test cloud/swarm/service-assertion.test.mjs
